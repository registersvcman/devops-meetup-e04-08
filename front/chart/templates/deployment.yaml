apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      containers:
        - name: front
          image: {{ required "image.repository is set by CI" .Values.image.repository }}:{{ .Values.image.tag }}
          ports: [{containerPort: 80}]
